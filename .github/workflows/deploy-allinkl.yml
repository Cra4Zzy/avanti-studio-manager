name: Avanti Studio — validate and deploy to ALL-INKL
on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - 'src/**'
      - 'assets/studio-icon*'
      - manifest.webmanifest
      - sw.js
      - 'scripts/prepare-studio.py'
      - '.github/workflows/deploy-allinkl.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to studio.haarstudio-avanti.de (dedicated FTPS account required)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: avanti-studio-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Check client scripts
        run: |
          node --check src/studio-live.js
          node --check src/install.js
          node --check sw.js
      - name: Prepare production app only
        run: python3 scripts/prepare-studio.py
      - uses: actions/upload-artifact@v4
        with:
          name: avanti-studio
          path: release/
          include-hidden-files: true
  connection:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Test dedicated FTPS login (read-only)
        env:
          FTP_HOST: ${{ secrets.STUDIO_FTPS_HOST }}
          FTP_USER: ${{ secrets.STUDIO_FTPS_USER }}
          LFTP_PASSWORD: ${{ secrets.STUDIO_FTPS_PASSWORD }}
        run: |
          set -eu
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$LFTP_PASSWORD"
          case "$FTP_HOST" in *[!a-zA-Z0-9.-]*|'') exit 1;; esac
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp <<LFTP_SCRIPT
          set cmd:fail-exit true
          set ssl:verify-certificate true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:max-retries 2
          set net:timeout 25
          open --env-password --user "$FTP_USER" "ftp://$FTP_HOST"
          cd /
          cls -1 > /dev/null
          bye
          LFTP_SCRIPT
  deploy:
    needs: validate
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && vars.STUDIO_AUTO_DEPLOY == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: avanti-studio
          path: release
      - name: Secure upload to the dedicated studio document root
        env:
          FTP_HOST: ${{ secrets.STUDIO_FTPS_HOST }}
          FTP_USER: ${{ secrets.STUDIO_FTPS_USER }}
          LFTP_PASSWORD: ${{ secrets.STUDIO_FTPS_PASSWORD }}
        run: |
          set -eu
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$LFTP_PASSWORD"
          case "$FTP_HOST" in *[!a-zA-Z0-9.-]*|'') exit 1;; esac
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp <<LFTP_SCRIPT
          set cmd:fail-exit true
          set ssl:verify-certificate true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:max-retries 2
          set net:timeout 25
          open --env-password --user "$FTP_USER" "ftp://$FTP_HOST"
          mirror -R --no-perms release/src /src
          mirror -R --no-perms release/assets /assets
          put release/manifest.webmanifest -o /manifest.webmanifest
          put release/sw.js -o /sw.js
          put release/styles.css -o /styles.css
          put release/index.html -o /index.html
          put release/build-info.json -o /build-info.json
          bye
          LFTP_SCRIPT
      - name: Verify the actual published studio over HTTPS
        run: |
          set -eu
          for file in index.html styles.css src/studio-original.css src/studio-live.js src/studio-live.css src/install.js assets/studio-icon.svg manifest.webmanifest sw.js build-info.json; do
            curl --fail --silent --show-error --retry 3 --max-time 30 "https://studio.haarstudio-avanti.de/$file?revision=$GITHUB_SHA" -o /tmp/avanti-studio-live
            cmp "release/$file" /tmp/avanti-studio-live
          done
          curl --fail --silent --show-error --retry 3 --max-time 30 -H "Cache-Control: no-cache" "https://studio.haarstudio-avanti.de/?revision=$GITHUB_SHA" -o /tmp/avanti-studio-root
          cmp release/index.html /tmp/avanti-studio-root
